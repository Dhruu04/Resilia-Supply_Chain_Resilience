<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGradA" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#312e81" />
      <stop offset="45%" stopColor="#4f46e5" />
      <stop offset="85%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="orbitGradB" x1="85" y1="15" x2="15" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#c7d2fe" />
      <stop offset="100%" stopColor="#4f46e5" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- High-def Circular Base Badge -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" filter="url(#softShadow)" />
  <circle cx="50" cy="50" r="47" stroke="url(#orbitGradA)" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Outer Swirling Orbital Arcs -->
  <circle cx="50" cy="50" r="41" stroke="url(#orbitGradA)" stroke-width="2.2" stroke-opacity="0.4" />
  <path
    d="M 50 9 A 41 41 0 0 1 91 50 A 41 41 0 0 1 59 90.2"
    stroke="url(#orbitGradA)"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M 50 91 A 41 41 0 0 1 9 50 A 41 41 0 0 1 41 9.8"
    stroke="url(#orbitGradB)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Middle Concentric Orbit Track -->
  <circle cx="50" cy="50" r="28" stroke="url(#orbitGradA)" stroke-width="2.6" stroke-dasharray="155 22" />

  <!-- Inner Concentric Orbit Track -->
  <circle cx="50" cy="50" r="16" stroke="url(#orbitGradA)" stroke-width="2.8" />

  <!-- Center Nucleus Node -->
  <circle cx="50" cy="50" r="6" fill="url(#orbitGradA)" />
  <circle cx="50" cy="50" r="2.8" fill="#ffffff" />

  <!-- Orbital Constellation Pearl Nodes -->
  <!-- Outer Orbit Nodes -->
  <circle cx="21" cy="41" r="3" fill="url(#nodeGlow)" stroke="#4338ca" stroke-width="1.8" />
  <circle cx="79" cy="59" r="3" fill="url(#nodeGlow)" stroke="#06b6d4" stroke-width="1.8" />

  <!-- Middle Orbit Nodes -->
  <circle cx="50" cy="22" r="3.2" fill="url(#nodeGlow)" stroke="#3730a3" stroke-width="1.8" />
  <circle cx="76" cy="41" r="3.2" fill="url(#nodeGlow)" stroke="#0891b2" stroke-width="1.8" />
  <circle cx="50" cy="78" r="3.2" fill="url(#nodeGlow)" stroke="#059669" stroke-width="1.8" />
  <circle cx="24" cy="59" r="3.2" fill="url(#nodeGlow)" stroke="#4f46e5" stroke-width="1.8" />

  <!-- Inner Orbit Nodes -->
  <circle cx="66" cy="50" r="2.8" fill="url(#nodeGlow)" stroke="#0891b2" stroke-width="1.6" />
  <circle cx="37" cy="39" r="2.8" fill="url(#nodeGlow)" stroke="#4338ca" stroke-width="1.6" />
</svg>
